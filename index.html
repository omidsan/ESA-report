<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Inquiry Report — Ervin Shimi Azma</title>

<style>
  :root {
    --bg: #f7f8fa;
    --surface: #ffffff;
    --border: #e5e7eb;
    --text: #1f2937;
    --text-muted: #6b7280;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --success: #16a34a;
    --warning: #d97706;
    --danger: #dc2626;
    --radius: 6px;
    --font: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
    padding: 20px 16px;
    min-height: 100vh;
  }

  .container { max-width: 100%; margin: 0 auto; }
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .page-title {
    font-size: 1.3rem;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .page-subtitle {
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  /* Login */
  #login-screen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 16px;
  }
  .login-box {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 32px 28px;
    max-width: 340px;
    width: 100%;
    text-align: center;
  }
  .login-box h2 { font-size: 1.1rem; margin-bottom: 6px; }
  .login-box p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 16px; }
  .login-box input {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 0.9rem;
    margin-bottom: 10px;
    outline: none;
  }
  .login-box input:focus { border-color: var(--primary); }
  .login-box button {
    width: 100%;
    padding: 9px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  .login-box button:hover { background: var(--primary-hover); }
  .login-error {
    color: var(--danger);
    font-size: 0.8rem;
    margin-top: 8px;
    display: none;
  }

  /* Stats */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 8px;
    margin-bottom: 10px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 10px;
  }
  .stat-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-muted);
    font-weight: 600;
    margin-bottom: 2px;
  }
  .stat-value {
    font-size: 1.1rem;
    font-weight: 700;
    line-height: 1.2;
  }
  .stat-value.success { color: var(--success); }
  .stat-value.danger { color: var(--danger); }
  .stat-value.warning { color: var(--warning); }

  /* Filtered stats (inline, lighter) */
  .filtered-stats {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 16px;
    font-size: 0.75rem;
    color: var(--text-muted);
    padding: 6px 0 0;
    border-top: 1px dashed var(--border);
    margin-top: 6px;
  }
  .filtered-stats b { color: var(--text); }

  /* Filters */
  /* Filters (compact) */
  .filters-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .filters-row-bottom {
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px dashed var(--border);
  }
  .filters-row-bottom.hidden-date {
    border-top: none;
    margin-top: 0;
    padding-top: 0;
  }
  .filter-group-date.hidden {
    display: none;
  }
  .filter-group {
    flex: 0 1 130px;
    min-width: 100px;
  }
  .filter-group:first-child {
    flex: 0 1 200px;
    min-width: 150px;
  }
  .filter-group select,
  .filter-group input {
    width: 100%;
    padding: 5px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 0.8rem;
    background: var(--surface);
    color: var(--text);
    outline: none;
  }
  .filter-group select:focus,
  .filter-group input:focus { border-color: var(--primary); }

  .filter-group-label {
    font-size: 0.65rem;
    font-weight: 600;
    color: var(--text-muted);
    margin-right: 4px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .filter-group-date {
    display: flex;
    align-items: center;
    flex: 0 1 auto;
    gap: 4px;
    padding: 2px 6px;
    background: #fef9f3;
    border: 1px solid #fde8cc;
    border-radius: 4px;
  }
  .filter-group-date.hidden {
    display: none;
  }
  .filter-group-date .filter-group-label {

  }
  .date-range-inline {
    display: flex;
    gap: 4px;
  }
  .date-range-inline input {
    padding: 4px 6px;
    border: 1px solid #fde8cc;
    border-radius: 3px;
    font-size: 0.75rem;
    outline: none;
    font-family: var(--font);

    background: #fff;

  .date-range-inline input:focus { border-color: #d97706; }

  .filter-group-search {
    flex: 1 1 3000px;
    min-width: 200px;
    max-width: 500px;
    margin: 0 auto;   /* وسط‌چین */
  }
  .filter-group-search .search-input {
    width: 100%;
    padding: 5px 10px;
    border: 1px solid #dbeafe;
    border-radius: 4px;
    font-size: 0.8rem;
    background: #f8fbff;
    color: var(--text);
    outline: none;
    text-align: left;
  }
  .filter-group-search .search-input::placeholder {
    color: #93b4d8;
  }
  .filter-group-search .search-input:focus {

    background: #fff;

  .toolbar-inline {

    gap: 4px;
    margin: 0;
    flex: 0 0 auto;
  }
  .toolbar-inline .btn {

  /* Active filters chips */

    gap: 4px;

  .active-filters:empty { display: none; }
  .filter-chip {

    gap: 4px;

    font-weight: 600;

    color: #3b82f6;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  /* Filtered stats */
  .filtered-stats {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 16px;
    font-size: 0.75rem;
    color: var(--text-muted);
    padding: 6px 0 0;
    border-top: 1px dashed var(--border);
    margin-top: 6px;
  }
  .filtered-stats b { color: var(--text); }
  .search-chip {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #eff6ff;
    color: #1d4ed8;
    border: 1px solid #bfdbfe;

    background: #f9fafb;
    color: var(--text-muted);
    font-weight: 600;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    position: sticky;
    top: 0;
    cursor: pointer;
    user-select: none;

    top: 0;
    right: 0;

    background: var(--primary);

    z-index: 200;

</style>

<script>
async function loadSecureData(password) {
  const btn = document.querySelector('.login-box button');
  const origText = btn.textContent;
  btn.textContent = 'در حال رمزگشایی…';
  btn.disabled = true;

  try {
    // دریافت فایل رمزگذاری‌شده از کنار فایل HTML
    const resp = await fetch('./data.enc.json');
    if (!resp.ok) throw new Error('File not found');
    const enc = await resp.json();
    
    const b64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
    const salt = b64(enc.salt), iv = b64(enc.iv), tag = b64(enc.tag);
    const cipherText = b64(enc.data);

    const enc2 = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      'raw', enc2.encode(password), 'PBKDF2', false, ['deriveKey']
    );
    
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: 300000, hash: 'SHA-256' },
      keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
    );

    const combined = new Uint8Array(cipherText.length + tag.length);
    combined.set(cipherText); combined.set(tag, cipherText.length);

    const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, combined);
    return JSON.parse(new TextDecoder().decode(decrypted));
    
  } catch (e) {
    console.error(e);
    alert('رمز عبور اشتباه است یا فایل داده پیدا نشد.');
    return null;
  } finally {
    btn.textContent = origText;
    btn.disabled = false;
  }
}
</script>

    tableBody:   () => document.querySelector('#report-table tbody'),

      customer:    () => document.getElementById('f-customer'),

    }

  // ---------- Helpers ----------
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  // format any date-like value as "10-Nov-26"
  function formatDate(value) {
    if (value === null || value === undefined || value === '') return '';
    let d;
    if (value instanceof Date) {
      d = value;
    } else {
      // try direct parse
      d = new Date(value);
      if (isNaN(d.getTime())) return String(value);
    }
    const day = String(d.getDate()).padStart(2, '0');
    const mon = MONTHS[d.getMonth()];
    const yr  = String(d.getFullYear()).slice(-2);
    return `${day}-${mon}-${yr}`;
  }

  function formatNumber(n) {
    if (n === null || n === undefined || n === '') return '';
    const num = parseFloat(String(n).replace(/,/g, ''));
    return isNaN(num) ? n : num.toLocaleString('en-US');
  }

  function formatPayment(v) {
    if (v === null || v === undefined || v === '') return '';
    const num = parseFloat(v);
    if (isNaN(num)) return v;
    return Math.round(num * 100) + '%';
  }

  // Order Sent: only show content inside parentheses, e.g. "20 of 20 units shipped (Complete)" -> "Complete"
  function formatOrderSent(v) {
    if (v === null || v === undefined || v === '') return '';
    const s = String(v);
    const m = s.match(/\(([^)]+)\)/);
    return m ? m[1].trim() : s;
  }

  function uniqueSorted(rows, key) {
    return [...new Set(rows.map(r => r[key]).filter(Boolean))].sort();
  }

  function getCleanCurrency(currency) {
    if (!currency) return '';
    return currency.replace(' (Out)', '').trim();
  }

  function isForeignCurrency(currency) {
    return currency && currency.includes('(Out)');
  }

  // ---------- Login ----------
async function checkPassword() {
  const pwd = dom.loginInput().value;
  
  if (pwd === PASSWORD) {
    // ۱. مخفی کردن صفحه لاگین و نمایش برنامه
    dom.loginScreen().style.display = 'none';
    dom.mainApp().style.display = 'block';
    
    // ۲. گرفتن داده‌ها با استفاده از همان رمز
    const rows = await loadSecureData(pwd);
    
    if (rows) {
      window.allRows = rows;
      init(); // شروع برنامه
    } else {
      // اگر رمزگشایی شکست خورد، دوباره صفحه لاگین را نشان بده
      dom.loginScreen().style.display = 'flex';
      dom.mainApp().style.display = 'none';
      dom.loginInput().value = '';
    }
  } else {
    dom.loginError().style.display = 'block';
  }
}

  // ---------- Init ----------
  function init() {
    if (typeof allRows === 'undefined') {
      dom.subtitle().textContent = 'Error: data.js not loaded.';
      return;
    }

    state.rows = allRows.map(r => {
      let pi = '';
      const piC = (r['PI-C'] || '').trim();
      const piT = (r['PI-T'] || '').trim();
      if (piC && piT) pi = piC + ' / ' + piT;
      else if (piC) pi = piC;
      else if (piT) pi = piT;

      // INQ: separate "Inquiry No | Brand" into two fields
      let rawInq = String(r['Inquiry No'] || '');
      rawInq = rawInq.replace(/\n/g, ' ');  // newlines -> space
      let inqNo = rawInq;
      let brand = '';

      if (rawInq.includes(' | ')) {
        const parts = rawInq.split(' | ');
        inqNo = parts[0].trim();
        brand = parts.slice(1).join(' | ').trim();
      }

      return { ...r, PI: pi, 'Inquiry No': inqNo, Brand: brand };
    });

    dom.subtitle().textContent =
      `Total records: ${state.rows.length} · Last updated: ${new Date().toLocaleString('en-US')}`;

    populateDropdowns();
    bindFilterEvents();

    // Init order date inputs
    const of = dom.filters.orderFrom();
    const ot = dom.filters.orderTo();
    if (of) of.value = state.orderFrom || '';
    if (ot) ot.value = state.orderTo || '';

    updateOrderDateVisibility();

    applyFilters();
  }

  function populateDropdowns() {
    uniqueSorted(state.rows, 'Customer').forEach(c => {
      const o = document.createElement('option');

      dom.filters.customer().appendChild(o);
    });

    uniqueSorted(state.rows, 'Product').forEach(p => {
      const o = document.createElement('option');
      o.value = p; o.textContent = p;
      dom.filters.product().appendChild(o);
    });

    // Status: distinct values + "Pending" (for empty status)
    const statusSet = new Set(uniqueSorted(state.rows, 'Status'));
    statusSet.add('Pending');
    Array.from(statusSet).sort().forEach(s => {
      const o = document.createElement('option');
      o.value = s; o.textContent = s;
      dom.filters.status().appendChild(o);
    });

    const currencySet = new Set();
    state.rows.forEach(r => {

  // ---------- Column resize ----------
  const COL_WIDTHS_KEY = 'sir_col_widths_v1';

  function loadColumnWidths() {
    try {
      const raw = localStorage.getItem(COL_WIDTHS_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }

  function saveColumnWidths(obj) {
    try { localStorage.setItem(COL_WIDTHS_KEY, JSON.stringify(obj)); } catch (e) {}
  }

  function applySavedWidths() {
    const widths = loadColumnWidths();
    if (!Object.keys(widths).length) return;

    const ths = dom.tableHead().querySelectorAll('th');
    ths.forEach((th, i) => {
      const w = widths[i];
      if (w) {
        th.style.width = w + 'px';
        th.style.minWidth = w + 'px';
        th.style.maxWidth = w + 'px';
      }
    });

    const trs = dom.tableBody().querySelectorAll('tr');
    trs.forEach(tr => {
      tr.querySelectorAll('td').forEach((td, i) => {
        const w = widths[i];
        if (w) {
          td.style.width = w + 'px';
          td.style.minWidth = w + 'px';
          td.style.maxWidth = w + 'px';
        }
      });
    });
  }

  function attachColumnResizers() {
    const ths = dom.tableHead().querySelectorAll('th');
    ths.forEach((th, idx) => {
      if (th.querySelector('.col-resizer')) return;

      const handle = document.createElement('span');
      handle.className = 'col-resizer';
      th.appendChild(handle);

      let startX = 0, startW = 0;

      handle.addEventListener('mousedown', (e) => {
        e.preventDefault();
        e.stopPropagation(); // جلوگیری از sort شدن با کلیک روی resizer
        startX = e.pageX;
        startW = th.offsetWidth;
        document.body.style.cursor = 'col-resize';

        const onMove = (ev) => {
          const delta = ev.pageX - startX;
          const newW = Math.max(40, startW + delta);
          th.style.width = newW + 'px';
          th.style.minWidth = newW + 'px';
          th.style.maxWidth = newW + 'px';

          const trs = dom.tableBody().querySelectorAll('tr');
          trs.forEach(tr => {
            const td = tr.children[idx];
            if (td) {
              td.style.width = newW + 'px';
              td.style.minWidth = newW + 'px';
              td.style.maxWidth = newW + 'px';
            }
          });
        };

        const onUp = () => {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
          document.body.style.cursor = '';
          const widths = loadColumnWidths();
          widths[idx] = th.offsetWidth;
          saveColumnWidths(widths);
        };

        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    });
  }

  // ---------- Filtering ----------
  function readFilters() {
    return {
      customer:    dom.filters.customer().value,
      product:     dom.filters.product().value,
      status:      dom.filters.status().value,
      currency:    dom.filters.currency().value,
      paymentType: dom.filters.paymentType().value,
      terms:        dom.filters.terms().value,
      globalSearch: dom.filters.globalSearch().value.trim().toLowerCase()
    };
  }

  function rowMatches(r, f) {
    if (f.customer && r.Customer !== f.customer) return false;
    if (f.product && r.Product !== f.product) return false;
    if (f.status) {
      const rowStatus = r.Status ? String(r.Status) : 'Pending';
      if (rowStatus !== f.status) return false;
    }
    if (f.terms && r['Terms of Delivery'] !== f.terms) return false;

    if (f.currency) {
      const rowCurrency = getCleanCurrency(r['Price Unit']);
      if (rowCurrency !== f.currency) return false;
    }

    if (f.paymentType === 'domestic' && isForeignCurrency(r['Price Unit'])) return false;
    if (f.paymentType === 'foreign' && !isForeignCurrency(r['Price Unit'])) return false;


    // Order date range (from/to)
    if (state.orderFrom || state.orderTo) {
      const raw = r['Date-Ordered'];
      if (!raw) return false;
      const d = new Date(raw);
      if (isNaN(d.getTime())) return false;
      const dDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      if (state.orderFrom) {
        const from = new Date(state.orderFrom + 'T00:00:00');
        if (!isNaN(from.getTime()) && dDay < from) return false;
      }
      if (state.orderTo) {
        const to = new Date(state.orderTo + 'T00:00:00');
        if (!isNaN(to.getTime()) && dDay > to) return false;
      }
    }

    // Quick preset
    if (state.quickPreset) {
      const status = String(r.Status || '').toLowerCase();
      const payment = parseFloat(r['Payment Received']);
      const hasPayment = !isNaN(payment);
      const orderSent = String(r['The order was sent'] || '').toLowerCase();
      const isComplete = orderSent.includes('complete');
      const isPartial = orderSent.includes('partial');
      const isNotSent = orderSent.includes('not sent') || orderSent === '';
      const hasInvoice = !!r['sent invoice'];

      switch (state.quickPreset) {
        case 'openOrders':
          if (status !== 'ordered') return false;
          if (hasPayment && payment >= 1) return false;
          break;

        case 'completedOrders':
          if (hasPayment && payment >= 1) {
            // ok
          } else {
            return false;
          }
          break;

        case 'overdueOrders':
          if (status !== 'ordered') return false;
          if (isComplete) return false;
          {
            const raw = r['Date-Ordered'];
            if (!raw) return false;
            const d = new Date(raw);
            if (isNaN(d.getTime())) return false;
            const days = (Date.now() - d.getTime()) / (1000 * 60 * 60 * 24);
            if (days < 180) return false;
          }
          break;

        case 'awaitingShipment':
          if (status !== 'ordered') return false;
          if (isComplete) return false;
          break;

        case 'awaitingInvoice':
          if (!isComplete && !isPartial) return false;
          if (hasInvoice) return false;
          break;

        case 'awaitingPayment':
          if (!hasInvoice) return false;
          if (hasPayment && payment >= 1) return false;
          break;
      }
    }

    // Date range filters (per-column)
    for (const key in state.dateFilters) {
      const range = state.dateFilters[key];
      if (!range) continue;
      const from = parseDateInput(range.from);
      const to   = parseDateInput(range.to);

      const raw = r[key];
      if (!raw) {
        if (from || to) return false;
        continue;
      }
      const d = new Date(raw);
      if (isNaN(d.getTime())) {
        if (from || to) return false;
        continue;
      }
      const dDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      if (from && dDay < from) return false;
      if (to   && dDay > to)   return false;
    }

    // Global search
    if (f.globalSearch) {
      const haystack = Object.keys(r)
        .map(k => String(r[k] ?? ''))
        .join(' ')
        .toLowerCase();
      if (!haystack.includes(f.globalSearch)) return false;
    }

    return true;
  }

  function applyFilters() {
    const f = readFilters();
    state.filteredRows = state.rows.filter(r => rowMatches(r, f));
    renderActiveFilters(f);
    renderFilteredStats();
    render();
  }

  // ---------- Stats ----------


  function renderFilteredStats() {
    const rows = state.filteredRows;
    const total = rows.length;

    // Ordered: تعداد رکوردهایی که Status = "Ordered" (بدون یکتا کردن)
    const ordered = rows.filter(r => String(r.Status || '').toLowerCase() === 'ordered').length;

    // Success Rate: مبنا = Inquiry های یکتا با CO ارسال‌شده (Actions Final شامل C بزرگ)
    // مخرج = تعداد unique inquiry با CO
    // صورت = تعداد unique inquiry با CO که Status = Ordered
    const uniqueWithC = new Set();
    const uniqueOrderedWithC = new Set();

    rows.forEach(r => {
      const action = String(r['Actions Final sent Offer'] || '');
      const hasC = action.includes('C') && !action.includes('c');
      if (!hasC) return;

      const key = (r.Customer || '') + '|' + (r['Inquiry No'] || '');
      uniqueWithC.add(key);

      if (String(r.Status || '').toLowerCase() === 'ordered') {
        uniqueOrderedWithC.add(key);
      }
    });

    const rate = uniqueWithC.size
      ? ((uniqueOrderedWithC.size / uniqueWithC.size) * 100).toFixed(1)
      : '0.0';

    dom.filteredStats().innerHTML =
      `<span>Filtered: <b>${total}</b></span>` +
      `<span>Ordered: <b>${ordered}</b></span>` +
      `<span>Success: <b>${rate}%</b></span>`;
  }

  // ---------- Sorting ----------
  // Date columns for sort: parse as timestamps
  const DATE_SORT_KEYS = new Set([
    'Date Of Inquiry Customer',
    'Date-Ordered',
    'date sent',
    'sent invoice',
    'Date Payment Received'
  ]);

  // Shipment Status priority for sort
  const SHIPMENT_STATUS_ORDER = {
    'not sent': 1,
    'partial': 2,
    'complete': 3
  };

  function parseDateValue(v) {
    if (v === null || v === undefined || v === '') return NaN;
    if (v instanceof Date) return v.getTime();
    const d = new Date(v);
    return isNaN(d.getTime()) ? NaN : d.getTime();
  }

  function parseShipmentStatus(v) {
    if (v === null || v === undefined || v === '') return 0;
    const s = String(v).toLowerCase().trim();
    // حالا مقدار ممکنه "Complete" / "Partial" / "Not sent" باشه (چون formatOrderSent قبلاً اجرا شده)
    // یا مقدار اصلی "(Complete)" / "(Partial)" / "(Not sent)" باشه اگر قبل از فرمت sort کنیم
    // با هر دو حالت کنار می‌آییم
    if (s.includes('complete')) return 3;
    if (s.includes('partial')) return 2;
    if (s.includes('not sent') || s.includes('not sent')) return 1;
    return 0;
  }

  function sortRows(rows) {
    if (!state.sortKey) return rows;
    const key = state.sortKey;
    const isDate = DATE_SORT_KEYS.has(key);
    const isShipmentStatus = key === 'The order was sent';

    return [...rows].sort((a, b) => {
      const va = a[key] ?? '';
      const vb = b[key] ?? '';

      // Date columns
      if (isDate) {
        const na = parseDateValue(va);
        const nb = parseDateValue(vb);
        const vaEmpty = isNaN(na), vbEmpty = isNaN(nb);
        if (vaEmpty && vbEmpty) return 0;
        if (vaEmpty) return 1;   // خالی‌ها همیشه آخر
        if (vbEmpty) return -1;
        return state.sortAsc ? na - nb : nb - na;
      }

      // Shipment Status: priority-based
      if (isShipmentStatus) {
        const na = parseShipmentStatus(va);
        const nb = parseShipmentStatus(vb);
        return state.sortAsc ? na - nb : nb - na;
      }

      // Numeric
      const fa = parseFloat(va), fb = parseFloat(vb);
      if (!isNaN(fa) && !isNaN(fb)) {
        return state.sortAsc ? fa - fb : fb - fa;
      }

      // Text
      return state.sortAsc
        ? String(va).localeCompare(String(vb))
        : String(vb).localeCompare(String(va));
    });
  }

  function sortTable(key) {
    if (state.sortKey === key) state.sortAsc = !state.sortAsc;
    else { state.sortKey = key; state.sortAsc = true; }
    render();
  }

  // ---------- Render ----------
  function render() {
    renderFilteredStats();

    const rows = sortRows(state.filteredRows);

    // Dynamic header label: if Status filter = Ordered, rename "Status Date" column to "PO Date"
    // Dynamic header label
    const statusFilter = (dom.filters.status().value || '').trim();
    const isOrderedFilter = statusFilter.toLowerCase() === 'ordered';

    dom.tableHead().innerHTML = '<tr>' + COLUMNS.map(c => {
      const icon = state.sortKey === c.key ? (state.sortAsc ? ' ▲' : ' ▼') : '';
      let label = c.label;
      if (c.key === 'Date-Ordered' && isOrderedFilter) {
        label = 'PO Date';
      }

      const isDateCol = DATE_FILTER_KEYS.includes(c.key);
      const hasRange = state.dateFilters[c.key] && (state.dateFilters[c.key].from || state.dateFilters[c.key].to);
      const filterBtn = isDateCol
        ? `<span class="date-filter-btn${hasRange ? ' active' : ''}" data-date-key="${c.key}" title="Filter by date range">▾</span>`
        : '';

      return `<th onclick="App.sortTable('${c.key}')">${label}${icon}${filterBtn}</th>`;
    }).join('') + '</tr>';

    // bind date filter buttons
    dom.tableHead().querySelectorAll('.date-filter-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation(); // جلوگیری از sort
        const key = btn.getAttribute('data-date-key');
        openDatePopup(key, btn.parentElement);
      });
    });

    if (!rows.length) {
      dom.tableBody().innerHTML =
        `<tr><td colspan="${COLUMNS.length}" class="empty-state">No records match the current filters.</td></tr>`;
      return;
    }

    dom.tableBody().innerHTML = rows.map((r, idx) => {
      return '<tr>' + COLUMNS.map(c => {
        if (c.key === '__row__') {
          return `<td style="color:#9ca3af;text-align:right;">${idx + 1}</td>`;
        }
        let val = r[c.key] ?? '';

        // Date formatting
        if (['Date Of Inquiry Customer','Date-Ordered','date sent','sent invoice','Date Payment Received'].includes(c.key)) {
          val = formatDate(val);
        }

        // Order Sent -> only parentheses content
        if (c.key === 'The order was sent') {
          val = formatOrderSent(val);
        }

        // Payment -> percent
        if (c.key === 'Payment Received') {
          val = formatPayment(val);
        }

        // Price formatting
        if (c.key === 'Price') {
          val = formatNumber(val);
        }

        // Status: empty -> "Pending"
        if (c.key === 'Status') {
          if (!val) val = 'Pending';
          const cls = 'status-' + String(val).toLowerCase().replace(/\s+/g, '');
          return `<td class="${cls}">${val}</td>`;
        }

        return `<td>${val}</td>`;
      }).join('') + '</tr>';
    }).join('');

    attachColumnResizers();
    applySavedWidths();

    // Sync active state of quick buttons
    document.querySelectorAll('.quick-btn').forEach(btn => {
      const p = btn.getAttribute('data-preset') || '';
      if (p === state.quickPreset) btn.classList.add('active');
      else btn.classList.remove('active');
    });

    // Sync order date visibility (in case status changed externally)
    updateOrderDateVisibility();
  }

  // ---------- Reset ----------
  function resetFilters() {
    Object.values(dom.filters).forEach(fn => {
      const el = fn();
      if (!el) return;
      el.value = '';
      if (el.tagName === 'SELECT') el.selectedIndex = 0;
    });
    state.dateFilters = {};
    state.quickPreset = '';
    state.orderFrom = '';
    state.orderTo = '';
    state.sortKey = ''; state.sortAsc = true;
    updateOrderDateVisibility();
    applyFilters();
  }

  return { checkPassword, sortTable, resetFilters };

})();
</script>
</body>

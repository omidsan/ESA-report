<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Sales Inquiry Report — Ervin Shimi Azma</title>
<style>
  :root { --bg: #f7f8fa; --surface: #ffffff; --border: #e5e7eb; --text: #1f2937; --text-muted: #6b7280; --primary: #2563eb; --primary-hover: #1d4ed8; --success: #16a34a; --warning: #d97706; --danger: #dc2626; --radius: 6px; --font: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.45; padding: 20px 16px; min-height: 100vh; }
  .container { max-width: 100%; margin: 0 auto; }
  .card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 12px 14px; margin-bottom: 10px; }
  .page-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 2px; }
  .page-subtitle { font-size: 0.85rem; color: var(--text-muted); }
  .filters-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .filter-group { flex: 0 1 130px; min-width: 100px; }
  .filter-group:first-child { flex: 0 1 200px; min-width: 150px; }
  .filter-group select, .filter-group input { width: 100%; padding: 5px 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 0.8rem; background: var(--surface); color: var(--text); outline: none; }
  .filter-group select:focus, .filter-group input:focus { border-color: var(--primary); }
  .filter-group-label { font-size: 0.65rem; font-weight: 600; color: var(--text-muted); margin-right: 4px; text-transform: uppercase; letter-spacing: 0.03em; }
  .filter-group-date { display: flex; align-items: center; flex: 0 1 auto; gap: 4px; padding: 2px 6px; background: #fef9f3; border: 1px solid #fde8cc; border-radius: 4px; }
  .filter-group-date.hidden { display: none; }
  .filter-group-date .filter-group-label { color: #b45309; }
  .date-range-inline { display: flex; gap: 4px; }
  .date-range-inline input { padding: 4px 6px; border: 1px solid #fde8cc; border-radius: 3px; font-size: 0.75rem; outline: none; font-family: var(--font); width: 110px; background: #fff; }
  .date-range-inline input:focus { border-color: #d97706; }
  .filter-group-search { flex: 1 1 3000px; min-width: 200px; max-width: 500px; margin: 0 auto; }
  .filter-group-search .search-input { width: 100%; padding: 5px 10px; border: 1px solid #dbeafe; border-radius: 4px; font-size: 0.8rem; background: #f8fbff; color: var(--text); outline: none; text-align: left; }
  .filter-group-search .search-input:focus { border-color: var(--primary); background: #fff; }
  .active-filters { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 0 0; }
  .active-filters:empty { display: none; }
  .filter-chip { display: inline-flex; align-items: center; gap: 4px; background: #eef2ff; color: #3730a3; border: 1px solid #c7d2fe; border-radius: 10px; padding: 2px 8px; font-size: 0.7rem; font-weight: 500; }
  .filter-chip .chip-key { color: #6366f1; font-weight: 600; }
  .filter-chip button { background: none; border: none; color: #6366f1; cursor: pointer; font-size: 0.8rem; line-height: 1; padding: 0; }
  .search-chip-wrap { display: flex; justify-content: center; padding: 4px 0 0; }
  .search-chip-wrap:empty { display: none; }
  .search-chip { display: inline-flex; align-items: center; gap: 6px; background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; border-radius: 10px; padding: 3px 10px; font-size: 0.75rem; font-weight: 600; }
  .search-chip .chip-key { color: #3b82f6; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .filtered-stats { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 0.75rem; color: var(--text-muted); padding: 6px 0 0; border-top: 1px dashed var(--border); margin-top: 6px; }
  .filtered-stats b { color: var(--text); }
  .btn { padding: 6px 14px; border: none; border-radius: 4px; font-size: 0.78rem; font-weight: 600; cursor: pointer; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-secondary { background: #e5e7eb; color: var(--text); }
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
  table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.82rem; }
  th, td { padding: 8px 10px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--border); }
  th { background: #f9fafb; color: var(--text-muted); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.03em; position: sticky; top: 0; cursor: pointer; user-select: none; z-index: 2; }

  th { position: relative; padding: 6px 10px; }
  tbody tr:hover { background: #f9fafb; }
  tbody tr:last-child td { border-bottom: none; }
  .status-ordered { color: var(--success); font-weight: 600; }
  .status-canceled, .status-rejected { color: var(--danger); }
  .status-lost, .status-hold { color: var(--warning); }
  .date-filter-btn { display: inline-block; margin-left: 4px; padding: 0 3px; font-size: 0.7rem; color: var(--text-muted); cursor: pointer; border: 1px solid transparent; border-radius: 3px; line-height: 1; vertical-align: middle; }
  .date-filter-btn.active { color: #fff; background: var(--primary); border-color: var(--primary); }
  .date-popup { position: absolute; z-index: 200; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); font-size: 0.8rem; min-width: 200px; top: 100%; right: 0; margin-top: 4px; }
  .date-popup label { display: block; font-size: 0.7rem; color: var(--text-muted); font-weight: 600; margin-bottom: 2px; }
  .date-popup input[type="date"] { width: 100%; padding: 4px 6px; border: 1px solid var(--border); border-radius: 4px; font-size: 0.78rem; margin-bottom: 6px; outline: none; font-family: var(--font); }
  .date-popup .popup-actions { display: flex; gap: 6px; margin-top: 4px; }
  .date-popup .popup-actions button { flex: 1; padding: 5px; border: none; border-radius: 4px; font-size: 0.75rem; font-weight: 600; cursor: pointer; }
  .date-popup .popup-actions .apply { background: var(--primary); color: #fff; }
  .date-popup .popup-actions .clear { background: #e5e7eb; color: var(--text); }
  .empty-state { text-align: center; padding: 32px 20px; color: var(--text-muted); font-size: 0.9rem; }
  .quick-filters { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 5px 10px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; }
  .quick-title { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-right: 4px; }
  .quick-btn { padding: 4px 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 12px; font-size: 0.72rem; font-weight: 600; cursor: pointer; }
  .quick-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .quick-actions { margin-left: auto; display: flex; gap: 4px; }
  .quick-actions .btn { padding: 4px 10px; font-size: 0.72rem; }
.main-row { cursor: pointer; }
.detail-row td { border-bottom: 1px solid var(--border); }
@media print {
  .detail-row { display: none !important; }
  .expand-btn { display: none !important; }
}
.status-in-progress { color: #2563eb; font-weight: 600; }
.table-wrap {
  max-height: 500px;
  overflow-y: auto;
  overflow-x: auto;
}
th { z-index: 2; }
@media print {
  .table-wrap { max-height: none; overflow: visible; }
}
.table-header-wrap {
  overflow: hidden;
  border: 1px solid var(--border);
  border-bottom: none;
  border-radius: var(--radius) var(--radius) 0 0;
  background: #f9fafb;
}
.table-wrap {
  max-height: 70vh;
  overflow-y: auto;
  overflow-x: auto;
  border: 1px solid var(--border);
  border-top: none;
  border-radius: 0 0 var(--radius) var(--radius);
}
.table-header-wrap table,
.table-wrap table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.82rem;
  table-layout: fixed;   /* مهم: ستون‌ها هم‌عرض می‌شوند */
}
</style>
</head>

<body>
<div id="login-overlay" style="position:fixed;inset:0;background:#f7f8fa;display:flex;align-items:center;justify-content:center;z-index:9999;">
  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:24px;width:320px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,0.06);">
    <div style="font-weight:700;font-size:1.1rem;margin-bottom:4px;">Sales Inquiry Report</div>
    <div style="font-size:0.8rem;color:#6b7280;margin-bottom:18px;">Enter password to access data</div>

    <input type="password" id="login-password" placeholder="Password"
           style="width:100%;padding:9px 10px;border:1px solid #e5e7eb;border-radius:4px;font-size:0.9rem;font-family:inherit;outline:none;margin-bottom:8px;"
           autocomplete="current-password">

    <label style="display:flex;align-items:center;gap:6px;font-size:0.78rem;color:#374151;margin-bottom:12px;cursor:pointer;user-select:none;">
      <input type="checkbox" id="login-show" style="cursor:pointer;">
      Show password
    </label>

    <button id="login-btn"
            style="width:100%;padding:9px;background:#2563eb;color:#fff;border:none;border-radius:4px;font-weight:600;font-size:0.85rem;cursor:pointer;">
      Sign in
    </button>

    <div id="login-error" style="color:#dc2626;font-size:0.78rem;margin-top:10px;display:none;">
      Incorrect password.
    </div>
  </div>
</div>
<div class="container" id="main-app">
  <div class="card">
    <div class="page-title">Sales Inquiry Report</div>
    <div class="page-subtitle" id="page-subtitle">در حال بارگذاری داده‌ها…</div>
  </div>

  <div class="card no-print" id="filter-card">
    <div class="filters-row">
      <div class="filter-group"><select id="f-customer"><option value="">All Customers</option></select></div>
      <div class="filter-group"><select id="f-product"><option value="">All Products</option></select></div>
      <div class="filter-group"><select id="f-status"><option value="">All Statuses</option></select></div>
      <div class="filter-group"><select id="f-currency"><option value="">All Currencies</option></select></div>
      <div class="filter-group"><select id="f-payment-type"><option value="">All Types</option><option value="domestic">Domestic</option><option value="foreign">Foreign (Out)</option></select></div>
      <div class="filter-group"><select id="f-terms"><option value="">All Terms</option></select></div>
      <div class="filter-group filter-group-date hidden" id="order-date-group">
        <span class="filter-group-label">Order Date</span>
        <div class="date-range-inline">
          <input type="date" id="f-order-from"><input type="date" id="f-order-to">
        </div>
      </div>
      <div class="filter-group filter-group-search">
        <input type="text" id="f-global-search" class="search-input" placeholder="Search anywhere…">
      </div>
    </div>
    <div class="active-filters" id="active-filters"></div>
    <div class="search-chip-wrap" id="search-chip-wrap"></div>
    <div class="filtered-stats" id="filtered-stats"></div>
  </div>

  <div class="quick-filters no-print" id="quick-filters">
    <span class="quick-title">Quick Filters</span>
    <button class="quick-btn" data-preset="openOrders">Open Orders</button>
    <button class="quick-btn" data-preset="completedOrders">Completed Orders</button>
    <button class="quick-btn" data-preset="overdueOrders">Delayed Orders</button>
    <button class="quick-btn" data-preset="awaitingShipment">Awaiting Shipment</button>
    <button class="quick-btn" data-preset="awaitingInvoice">Awaiting Invoice</button>
    <button class="quick-btn" data-preset="awaitingPayment">Awaiting Payment</button>
    <div class="quick-actions">
      <button class="btn btn-secondary" onclick="App.resetFilters()">Reset</button>
      <button class="btn btn-primary" onclick="window.print()">Print</button>
    </div>
  </div>

  <div class="card">
    <div class="table-header-wrap">
      <table id="report-table-head">
        <thead></thead>
      </table>
    </div>
    <div class="table-wrap">
      <table id="report-table">
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<!-- اسکریپت اصلی برنامه -->
<script>
const App = (function () {
  const COLUMNS = [
    { key: '__row__', label: '#' }, { key: 'Customer', label: 'Customer' },
    { key: 'Product', label: 'Product' }, { key: 'Inquiry No', label: 'INQ' },
    { key: 'Brand', label: 'Brand' }, { key: 'Date Of Inquiry Customer', label: 'INQ Date' },
    { key: 'PI', label: 'PI' }, { key: 'Status', label: 'Status' },
    { key: 'Date-Ordered', label: 'Status Date' }, { key: 'Price', label: 'Amount' },
    { key: 'Price Unit', label: 'Currency' }, { key: 'Terms of Delivery', label: 'Term' },
    { key: 'The order was sent', label: 'Shipment Status' }, { key: 'date sent', label: 'Ship Date' },
    { key: 'sent invoice', label: 'Invoice Sent' }, { key: 'Payment Received', label: 'Payment' },
    { key: 'Date Payment Received', label: 'Payment Date' }
  ];
  
  const state = { rows: [], filteredRows: [], sortKey: '', sortAsc: true, dateFilters: {}, quickPreset: '', orderFrom: '', orderTo: '' };

  const dom = {
    subtitle: () => document.getElementById('page-subtitle'), filteredStats: () => document.getElementById('filtered-stats'),
    activeFilters: () => document.getElementById('active-filters'), searchChipWrap: () => document.getElementById('search-chip-wrap'),
    tableHead: () => document.querySelector('#report-table thead'), tableBody: () => document.querySelector('#report-table tbody'),
    filters: {
      customer: () => document.getElementById('f-customer'), product: () => document.getElementById('f-product'),
      status: () => document.getElementById('f-status'), currency: () => document.getElementById('f-currency'),
      paymentType: () => document.getElementById('f-payment-type'), terms: () => document.getElementById('f-terms'),
      globalSearch: () => document.getElementById('f-global-search'), orderFrom: () => document.getElementById('f-order-from'),
      orderTo: () => document.getElementById('f-order-to')
    }
  };

  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function formatDate(value) {
    if (!value) return '';
    let d = new Date(value); if (isNaN(d.getTime())) return String(value);
    return `${String(d.getDate()).padStart(2, '0')}-${MONTHS[d.getMonth()]}-${String(d.getFullYear()).slice(-2)}`;
  }
  function formatNumber(n) { if (!n) return ''; const num = parseFloat(String(n).replace(/,/g, '')); return isNaN(num) ? n : num.toLocaleString('en-US'); }
  function formatPayment(v) { if (v === undefined || v === '') return ''; const num = parseFloat(v); return isNaN(num) ? v : Math.round(num * 100) + '%'; }
  function formatOrderSent(v) { if (!v) return ''; const m = String(v).match(/\(([^)]+)\)/); return m ? m[1].trim() : String(v); }
  function uniqueSorted(rows, key) { return [...new Set(rows.map(r => r[key]).filter(Boolean))].sort(); }
  function getCleanCurrency(currency) { return currency ? currency.replace(' (Out)', '').trim() : ''; }
  function isForeignCurrency(currency) { return currency && currency.includes('(Out)'); }

  function init() {
    if (!window.allRows) { dom.subtitle().textContent = 'Error: Data not loaded.'; return; }
    
    state.rows = window.allRows.map(r => {
      let pi = ''; const piC = String(r['PI-C'] ?? '').trim(); const piT = String(r['PI-T'] ?? '').trim();
      if (piC && piT) pi = piC + ' / ' + piT; else if (piC) pi = piC; else if (piT) pi = piT;
      let rawInq = String(r['Inquiry No'] ?? '').replace(/\n/g, ' ');
      let inqNo = rawInq; let brand = '';
      if (rawInq.includes(' | ')) { const parts = rawInq.split(' | '); inqNo = parts[0].trim(); brand = parts.slice(1).join(' | ').trim(); }
      return { ...r, PI: pi, 'Inquiry No': inqNo, Brand: brand };
    });

    dom.subtitle().textContent = `Total records: ${state.rows.length} · Last updated: ${new Date().toLocaleString('en-US')}`;
    populateDropdowns(); bindFilterEvents(); updateOrderDateVisibility(); applyFilters();
  }

  function populateDropdowns() {
    uniqueSorted(state.rows, 'Customer').forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; dom.filters.customer().appendChild(o); });
    uniqueSorted(state.rows, 'Product').forEach(p => { const o = document.createElement('option'); o.value = p; o.textContent = p; dom.filters.product().appendChild(o); });
    const statusSet = new Set(uniqueSorted(state.rows, 'Status')); statusSet.add('Pending'); statusSet.add('In Progress');
    Array.from(statusSet).sort().forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; dom.filters.status().appendChild(o); });
    const currencySet = new Set(); state.rows.forEach(r => { const c = getCleanCurrency(r['Price Unit']); if (c) currencySet.add(c); });
    Array.from(currencySet).sort().forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; dom.filters.currency().appendChild(o); });
    uniqueSorted(state.rows, 'Terms of Delivery').forEach(t => { const o = document.createElement('option'); o.value = t; o.textContent = t; dom.filters.terms().appendChild(o); });
  }

  function bindFilterEvents() {
    ['customer', 'product', 'status', 'currency', 'paymentType', 'terms'].forEach(id => { const el = dom.filters[id](); if (el) el.addEventListener('change', applyFilters); });
    dom.filters.globalSearch().addEventListener('input', () => setTimeout(applyFilters, 300));
    if (dom.filters.orderFrom()) dom.filters.orderFrom().addEventListener('change', (e) => { state.orderFrom = e.target.value; applyFilters(); });
    if (dom.filters.orderTo()) dom.filters.orderTo().addEventListener('change', (e) => { state.orderTo = e.target.value; applyFilters(); });
    document.querySelectorAll('.quick-btn').forEach(btn => btn.addEventListener('click', () => { state.quickPreset = btn.getAttribute('data-preset'); applyFilters(); }));
    dom.filters.status().addEventListener('change', updateOrderDateVisibility);
  }

  function updateOrderDateVisibility() {
    const group = document.getElementById('order-date-group');
    if ((dom.filters.status().value || '').toLowerCase() === 'ordered') group.classList.remove('hidden');
    else { group.classList.add('hidden'); if (dom.filters.orderFrom()) { dom.filters.orderFrom().value = ''; state.orderFrom = ''; } if (dom.filters.orderTo()) { dom.filters.orderTo().value = ''; state.orderTo = ''; } }
  }

  const DATE_FILTER_KEYS = ['Date Of Inquiry Customer', 'Date-Ordered', 'date sent', 'sent invoice', 'Date Payment Received'];
  function openDatePopup(key, anchorEl) {
    document.querySelectorAll('.date-popup').forEach(p => p.remove());
    const existing = state.dateFilters[key] || { from: '', to: '' };
    const pop = document.createElement('div'); pop.className = 'date-popup';
    pop.innerHTML = `<label>From</label><input type="date" class="df-from" value="${existing.from}"><label>To</label><input type="date" class="df-to" value="${existing.to}"><div class="popup-actions"><button type="button" class="apply">Apply</button><button type="button" class="clear">Clear</button></div>`;
    anchorEl.style.position = 'relative'; anchorEl.appendChild(pop);
    pop.querySelector('.apply').addEventListener('click', (e) => { e.stopPropagation(); state.dateFilters[key] = { from: pop.querySelector('.df-from').value, to: pop.querySelector('.df-to').value }; pop.remove(); applyFilters(); });
    pop.querySelector('.clear').addEventListener('click', (e) => { e.stopPropagation(); delete state.dateFilters[key]; pop.remove(); applyFilters(); });
    pop.addEventListener('click', e => e.stopPropagation());
    setTimeout(() => document.addEventListener('click', function h() { document.querySelectorAll('.date-popup').forEach(p => p.remove()); document.removeEventListener('click', h); }), 0);
  }

  function readFilters() {
    return { customer: dom.filters.customer().value, product: dom.filters.product().value, status: dom.filters.status().value, currency: dom.filters.currency().value, paymentType: dom.filters.paymentType().value, terms: dom.filters.terms().value, globalSearch: dom.filters.globalSearch().value.trim().toLowerCase() };
  }

  function rowMatches(r, f) {
    if (f.customer && r.Customer !== f.customer) return false;
    if (f.product && r.Product !== f.product) return false;
    if (f.status === 'In Progress') {
      const hasOffer = String(r['Actions Final sent Offer'] ?? '').trim() !== '';
      if ((r.Status || '') !== '' || hasOffer) return false;
    } else if (f.status === 'Pending') {
      const hasOffer = String(r['Actions Final sent Offer'] ?? '').trim() !== '';
      if ((r.Status || '') !== '' || !hasOffer) return false;
    } else if (f.status && (r.Status || 'Pending') !== f.status) return false;
    if (f.terms && r['Terms of Delivery'] !== f.terms) return false;
    if (f.currency && getCleanCurrency(r['Price Unit']) !== f.currency) return false;
    if (f.paymentType === 'domestic' && isForeignCurrency(r['Price Unit'])) return false;
    if (f.paymentType === 'foreign' && !isForeignCurrency(r['Price Unit'])) return false;

    if (state.orderFrom || state.orderTo) {
      const raw = r['Date-Ordered']; if (!raw) return false;
      const d = new Date(raw); if (isNaN(d.getTime())) return false;
      const dDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      if (state.orderFrom && dDay < new Date(state.orderFrom + 'T00:00:00')) return false;
      if (state.orderTo && dDay > new Date(state.orderTo + 'T00:00:00')) return false;
    }

    if (state.quickPreset) {
      const status = String(r.Status || '').toLowerCase(); const payment = parseFloat(r['Payment Received']); const hasPayment = !isNaN(payment);
      const orderSent = String(r['The order was sent'] || '').toLowerCase(); const isComplete = orderSent.includes('complete'); const isPartial = orderSent.includes('partial'); const hasInvoice = !!r['sent invoice'];
      switch (state.quickPreset) {
        case 'openOrders': if (status !== 'ordered' || (hasPayment && payment >= 1)) return false; break;
        case 'completedOrders': if (!(hasPayment && payment >= 1)) return false; break;
        case 'overdueOrders': if (status !== 'ordered' || isComplete) return false; const raw = r['Date-Ordered']; if (!raw) return false; const d = new Date(raw); if (isNaN(d.getTime()) || ((Date.now() - d.getTime()) / 86400000) < 180) return false; break;
        case 'awaitingShipment': if (status !== 'ordered' || isComplete) return false; break;
        case 'awaitingInvoice': if ((!isComplete && !isPartial) || hasInvoice) return false; break;
        case 'awaitingPayment': if (!hasInvoice || (hasPayment && payment >= 1)) return false; break;
      }
    }

    for (const key in state.dateFilters) {
      const range = state.dateFilters[key]; if (!range) continue;
      const from = range.from ? new Date(range.from + 'T00:00:00') : null; const to = range.to ? new Date(range.to + 'T00:00:00') : null;
      const raw = r[key]; if (!raw) { if (from || to) return false; continue; }
      const d = new Date(raw); if (isNaN(d.getTime())) { if (from || to) return false; continue; }
      const dDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      if (from && dDay < from) return false; if (to && dDay > to) return false;
    }

    if (f.globalSearch) { const haystack = Object.keys(r).map(k => String(r[k] ?? '')).join(' ').toLowerCase(); if (!haystack.includes(f.globalSearch)) return false; }
    return true;
  }

  function applyFilters() {
    const f = readFilters();
    state.filteredRows = state.rows.filter(r => rowMatches(r, f));
    renderActiveFilters(f);
    renderFilteredStats();
    render();
  }

  function clearOneFilter(key) {
    const el = dom.filters[key] ? dom.filters[key]() : dom.filters.globalSearch();
    if (el) { el.value = ''; if (el.tagName === 'SELECT') el.selectedIndex = 0; }
    applyFilters();
  }

  function renderActiveFilters(f) {
    const sWrap = dom.searchChipWrap(); sWrap.innerHTML = '';
    if (f.globalSearch) {
      const chip = document.createElement('span'); chip.className = 'search-chip'; chip.innerHTML = `<span class="chip-key">Search</span><span>${f.globalSearch}</span>`;
      const x = document.createElement('button'); x.innerHTML = '&times;'; x.onclick = () => clearOneFilter('globalSearch'); chip.appendChild(x); sWrap.appendChild(chip);
    }
    const wrap = dom.activeFilters(); wrap.innerHTML = '';
    const chipLabels = { customer: 'Customer', product: 'Product', status: 'Status', currency: 'Currency', paymentType: 'Payment Type', terms: 'Terms' };
    Object.keys(chipLabels).forEach(k => {
      if (f[k]) {
        const chip = document.createElement('span'); chip.className = 'filter-chip'; chip.innerHTML = `<span class="chip-key">${chipLabels[k]}:</span> ${f[k]}`;
        const x = document.createElement('button'); x.innerHTML = '&times;'; x.onclick = () => clearOneFilter(k); chip.appendChild(x); wrap.appendChild(chip);
      }
    });
    const dateLabels = { 'Date Of Inquiry Customer': 'INQ Date', 'Date-Ordered': 'Order Date', 'date sent': 'Ship Date', 'sent invoice': 'Invoice', 'Date Payment Received': 'Payment Date' };
    Object.keys(state.dateFilters).forEach(key => {
      const range = state.dateFilters[key]; if (!range || (!range.from && !range.to)) return;
      const chip = document.createElement('span'); chip.className = 'filter-chip'; chip.innerHTML = `<span class="chip-key">${dateLabels[key] || key}:</span> ${range.from || '…'} → ${range.to || '…'}`;
      const x = document.createElement('button'); x.innerHTML = '&times;'; x.onclick = () => { delete state.dateFilters[key]; applyFilters(); }; chip.appendChild(x); wrap.appendChild(chip);
    });
    if (state.quickPreset) {
      const presetLabels = { openOrders: 'Open Orders', completedOrders: 'Completed Orders', overdueOrders: 'Delayed Orders', awaitingShipment: 'Awaiting Shipment', awaitingInvoice: 'Awaiting Invoice', awaitingPayment: 'Awaiting Payment' };
      const chip = document.createElement('span'); chip.className = 'filter-chip'; chip.style.cssText = 'background:#dbeafe;border-color:#93c5fd;color:#1e40af;';
      chip.innerHTML = `<span class="chip-key" style="color:#3b82f6;">Preset:</span> ${presetLabels[state.quickPreset] || state.quickPreset}`;
      const x = document.createElement('button'); x.innerHTML = '&times;'; x.onclick = () => { state.quickPreset = ''; applyFilters(); }; chip.appendChild(x); wrap.appendChild(chip);
    }
    if (state.orderFrom || state.orderTo) {
      const chip = document.createElement('span'); chip.className = 'filter-chip'; chip.innerHTML = `<span class="chip-key">Order Date:</span> ${state.orderFrom || '…'} → ${state.orderTo || '…'}`;
      const x = document.createElement('button'); x.innerHTML = '&times;'; x.onclick = () => { state.orderFrom = ''; state.orderTo = ''; if (dom.filters.orderFrom()) dom.filters.orderFrom().value = ''; if (dom.filters.orderTo()) dom.filters.orderTo().value = ''; applyFilters(); }; chip.appendChild(x); wrap.appendChild(chip);
    }
  }

  function renderFilteredStats() {
    const rows = state.filteredRows; const total = rows.length; const ordered = rows.filter(r => String(r.Status || '').toLowerCase() === 'ordered').length;
    const uniqueWithC = new Set(); const uniqueOrderedWithC = new Set();
    rows.forEach(r => {
      const hasC = String(r['Actions Final sent Offer'] || '').includes('C') && !String(r['Actions Final sent Offer'] || '').includes('c');
      if (!hasC) return;
      const key = (r.Customer || '') + '|' + (r['Inquiry No'] || '');
      uniqueWithC.add(key); if (String(r.Status || '').toLowerCase() === 'ordered') uniqueOrderedWithC.add(key);
    });
    const rate = uniqueWithC.size ? ((uniqueOrderedWithC.size / uniqueWithC.size) * 100).toFixed(1) : '0.0';
    dom.filteredStats().innerHTML = `<span>Filtered: <b>${total}</b></span><span>Ordered: <b>${ordered}</b></span><span>Success: <b>${rate}%</b></span>`;
  }

  function sortTable(key) {
    if (state.sortKey === key) state.sortAsc = !state.sortAsc; else { state.sortKey = key; state.sortAsc = true; }
    render();
  }

  function render() {
    renderFilteredStats();
    const rows = [...state.filteredRows].sort((a, b) => {
      if (!state.sortKey) return 0;
      const va = a[state.sortKey] ?? ''; const vb = b[state.sortKey] ?? '';

      // ستون‌های تاریخ: تبدیل به timestamp
      if (DATE_FILTER_KEYS.includes(state.sortKey)) {
        const ta = va ? new Date(va).getTime() : NaN;
        const tb = vb ? new Date(vb).getTime() : NaN;
        // مقادیر خالی همیشه آخر بیایند (چه صعودی چه نزولی)
        if (isNaN(ta) && isNaN(tb)) return 0;
        if (isNaN(ta)) return 1;
        if (isNaN(tb)) return -1;
        return state.sortAsc ? ta - tb : tb - ta;
      }

      // بقیه ستون‌ها: عددی اگر هر دو عدد باشند، وگرنه رشته‌ای
      const fa = parseFloat(va), fb = parseFloat(vb);
      if (!isNaN(fa) && !isNaN(fb)) return state.sortAsc ? fa - fb : fb - fa;
      return state.sortAsc ? String(va).localeCompare(String(vb)) : String(vb).localeCompare(String(va));
    });

    const isOrderedFilter = (dom.filters.status().value || '').toLowerCase() === 'ordered';
    dom.tableHead().innerHTML = '<tr>' + COLUMNS.map(c => {
      const icon = state.sortKey === c.key ? (state.sortAsc ? ' ▲' : ' ▼') : '';
      const label = (c.key === 'Date-Ordered' && isOrderedFilter) ? 'PO Date' : c.label;
      const isDateCol = DATE_FILTER_KEYS.includes(c.key);
      const hasRange = state.dateFilters[c.key] && (state.dateFilters[c.key].from || state.dateFilters[c.key].to);
      const btn = isDateCol ? `<span class="date-filter-btn${hasRange ? ' active' : ''}" data-key="${c.key}">▾</span>` : '';
      return `<th onclick="App.sortTable('${c.key}')">${label}${icon}${btn}</th>`;
    }).join('') + '</tr>';

    dom.tableHead().querySelectorAll('.date-filter-btn').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); openDatePopup(btn.getAttribute('data-key'), btn.parentElement); }));

    if (!rows.length) { dom.tableBody().innerHTML = `<tr><td colspan="${COLUMNS.length}" class="empty-state">No records found.</td></tr>`; return; }

    dom.tableBody().innerHTML = rows.map((r, idx) => {
      const mainRow = '<tr class="main-row" data-idx="' + idx + '">' + COLUMNS.map(c => {
        if (c.key === '__row__') return `<td style="color:#9ca3af;text-align:right;white-space:nowrap;"><span class="expand-btn" data-idx="${idx}" style="display:inline-block;width:14px;cursor:pointer;color:#2563eb;user-select:none;">▶</span> ${idx + 1}</td>`;
        let val = r[c.key] ?? '';
        if (DATE_FILTER_KEYS.includes(c.key)) val = formatDate(val);
        else if (c.key === 'The order was sent') val = formatOrderSent(val);
        else if (c.key === 'Payment Received') val = formatPayment(val);
        else if (c.key === 'Price') val = formatNumber(val);
        
        if (c.key === 'Status') {
          if (!val) {
            const hasOffer = String(r['Actions Final sent Offer'] ?? '').trim() !== '';
            val = hasOffer ? 'Pending' : 'In Progress';
          }
          const cls = String(val).toLowerCase().replace(/\s+/g, '-');
          return `<td class="status-${cls}">${val}</td>`;
        }
        return `<td>${val}</td>`;
      }).join('') + '</tr>';

      const detailRow = '<tr class="detail-row" data-idx="' + idx + '" style="display:none;background:#f9fafb;">' +
        '<td colspan="' + COLUMNS.length + '" style="padding:8px 12px;">' +
          '<div style="display:flex;flex-wrap:wrap;gap:20px;font-size:0.78rem;">' +
            '<div><div style="font-size:0.65rem;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:0.03em;">Last Offer to Customer</div><div>' + (r['Actions Final sent Offer'] || '—') + '</div></div>' +
            '<div><div style="font-size:0.65rem;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:0.03em;">Last Action Date</div><div>' + (r['Date AF'] ? formatDate(r['Date AF']) : '—') + '</div></div>' +
          '</div>' +
        '</td>' +
      '</tr>';

      return mainRow + detailRow;
    }).join('');

    // بایند کلیک دکمه‌های باز/بسته
    dom.tableBody().querySelectorAll('.expand-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const idx = btn.getAttribute('data-idx');
        const detail = dom.tableBody().querySelector('.detail-row[data-idx="' + idx + '"]');
        // بستن همه زیرشاخه‌های دیگر
        dom.tableBody().querySelectorAll('.detail-row').forEach(d => {
          if (d !== detail) { d.style.display = 'none'; }
        });
        dom.tableBody().querySelectorAll('.expand-btn').forEach(b => {
          if (b !== btn) b.textContent = '▶';
        });
        // باز/بسته کردن این یکی
        if (detail.style.display === 'none') {
          detail.style.display = '';
          btn.textContent = '▼';
        } else {
          detail.style.display = 'none';
          btn.textContent = '▶';
        }
      });
    });

    document.querySelectorAll('.quick-btn').forEach(btn => btn.classList.toggle('active', btn.getAttribute('data-preset') === state.quickPreset));
    updateOrderDateVisibility();
  }

  function resetFilters() {
    Object.values(dom.filters).forEach(fn => { const el = fn(); if (el) { el.value = ''; if (el.tagName === 'SELECT') el.selectedIndex = 0; } });
    state.dateFilters = {}; state.quickPreset = ''; state.orderFrom = ''; state.orderTo = ''; state.sortKey = ''; state.sortAsc = true;
    applyFilters();
  }

  return { init, sortTable, resetFilters };
})();
</script>

<!-- اسکریپت رمزگشایی -->
<script>
async function tryDecrypt(password) {
  const resp = await fetch('./data.enc.json?v=' + Date.now());
  if (!resp.ok) throw new Error('data not found');
  const enc = await resp.json();
  const b64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  const keyMaterial = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']
  );
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64(enc.salt), iterations: 300000, hash: 'SHA-256' },
    keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
  );

  const cipherText = b64(enc.data), tag = b64(enc.tag);
  const combined = new Uint8Array(cipherText.length + tag.length);
  combined.set(cipherText); combined.set(tag, cipherText.length);

  const decrypted = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: b64(enc.iv) }, key, combined
  );
  return JSON.parse(new TextDecoder().decode(decrypted));
}

async function initApp() {
  const overlay = document.getElementById('login-overlay');
  const input = document.getElementById('login-password');
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-error');
  const show = document.getElementById('login-show');

  // چک‌باکس نمایش رمز
  show.addEventListener('change', () => {
    input.type = show.checked ? 'text' : 'password';
    input.focus();
  });

  async function attempt() {
    err.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Checking...';
    try {
      window.allRows = await tryDecrypt(input.value);
      overlay.remove();
      App.init();
    } catch (e) {
      console.error('login error:', e);
      err.style.display = 'block';
      err.textContent = 'Incorrect password.';
      btn.disabled = false;
      btn.textContent = 'Sign in';
      input.select();
    }
  }

  btn.addEventListener('click', attempt);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') attempt(); });
  input.focus();
}

window.addEventListener('DOMContentLoaded', initApp);
</script>
